plugins { id 'com.android.application' }
android {
    namespace 'com.jimu.sjm'
    compileSdk 36
    defaultConfig {
        applicationId 'com.jimu.sjm'
        minSdk 26
        targetSdk 36
        versionCode 9
        versionName '1.0.8'
    }
    signingConfigs {
        release {
            storeFile rootProject.file('.local/release.jks')
            storePassword System.getenv('SJM_SIGN_PASSWORD')
            keyAlias 'sjm'
            keyPassword System.getenv('SJM_SIGN_PASSWORD')
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
